# Copies ai-service/ to the Hugging Face Space whenever it changes on main; the Space then rebuilds itself.
# Needs: repository variable HF_SPACE (e.g. "your-hf-name/jobpulse-ai") and secret HF_TOKEN
# (a Hugging Face access token with "write" permission). Without them this does nothing.
name: Deploy AI service

on:
  push:
    branches: [main]
    paths: ["ai-service/**", ".github/workflows/deploy-ai-space.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_SPACE: ${{ vars.HF_SPACE }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Push ai-service to the Space
        if: env.HF_SPACE != '' && env.HF_TOKEN != ''
        working-directory: ai-service
        run: |
          rm -rf .venv .models .pytest_cache tests
          find . -name __pycache__ -prune -exec rm -rf {} +
          git init -q -b main
          git config user.name "JobPulse deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push --force "https://hf:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
