# Runs every check on GitHub's computers whenever code is pushed or a pull request is opened.
# Three jobs run side by side; a red ✗ on GitHub means one of them failed — click it to see why.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push cancels the still-running checks of the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The tests never connect to a database; the client just needs an address to exist.
      DATABASE_URL: postgres://ci:ci@127.0.0.1:1/none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Creates the route types (PageProps, LayoutProps) the dev server normally makes
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx next build

  ai-service:
    name: AI service (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install -r requirements.txt
      # The tests don't download the embedding model; they check CV reading and parsing
      - run: python -m pytest -q
